<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Faculty Sign In · Academic Session Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/shared-portal.css"/>
</head>
<body class="bg-[#faf9f6] text-[#1c1917] font-['Inter',sans-serif] min-h-screen flex items-center justify-center p-6 antialiased">
  <main class="w-full max-w-sm bg-white border border-[#e6e2da] rounded-lg p-8 shadow-sm">
    <div class="flex flex-col items-center text-center">
      <img alt="Prof. Krishnavel" class="w-16 h-16 rounded-full object-cover border-2 border-[#d6d0c4] shadow-sm mb-3" src="/professor_krishnavel.jpg"/>
      <div class="text-xs text-[#78716c] font-medium tracking-normal mb-1">SRMIST · Department of EEE</div>
      <h1 class="font-['Newsreader',serif] text-2xl font-normal text-[#1c1917]">Faculty Access</h1>
      <p class="text-xs text-[#57534e] mt-1 max-w-xs">Sign in to schedule advisory hours and manage student session dispatches</p>
    </div>

    <form class="mt-6 space-y-4" id="authForm" onsubmit="event.preventDefault(); simulateAuth();">
      <div>
        <label class="block text-xs font-medium text-[#57534e] mb-1" for="faculty-id">Faculty Email</label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3 text-[#78716c] text-[18px] pointer-events-none">mail</span>
          <input class="w-full bg-[#fbfaf8] text-[#1c1917] text-sm pl-9 pr-3 py-2 rounded border border-[#e6e2da] focus:outline-none focus:border-[#1c1917] focus:bg-white transition-colors cursor-default" id="faculty-id" readonly required type="email" value="srmeeelibraray@gmail.com"/>
        </div>
      </div>

      <div>
        <div class="flex justify-between items-baseline mb-1">
          <label class="text-xs font-medium text-[#57534e]" for="password">Passkey</label>
          <a class="text-xs text-[#1e3a8a] hover:underline" href="#" onclick="alert('Verification prompt dispatched to registered hardware token.'); return false;">Reset passkey</a>
        </div>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3 text-[#78716c] text-[18px] pointer-events-none">key</span>
          <input class="w-full bg-white text-[#1c1917] text-sm pl-9 pr-9 py-2 rounded border border-[#e6e2da] focus:outline-none focus:border-[#1c1917] transition-colors" id="password" required type="password" value="ACAD-TOKEN-KRISH-2024"/>
          <button aria-label="Toggle password visibility" class="absolute right-2.5 p-1 text-[#78716c] hover:text-[#1c1917] transition-colors" id="togglePassword" onclick="toggleSecretVisibility()" type="button">
            <span class="material-symbols-outlined text-[18px]" id="eyeIcon">visibility</span>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between pt-1">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input checked class="w-3.5 h-3.5 rounded border-[#e6e2da] text-[#1c1917] focus:ring-0" id="remember-workstation" type="checkbox"/>
          <span class="text-xs text-[#57534e]">Keep session active</span>
        </label>
        <span class="text-[11px] font-mono text-[#78716c]">Campus Network</span>
      </div>

      <button class="w-full mt-2 bg-[#1c1917] hover:bg-[#292524] text-white text-sm font-medium py-2.5 px-4 rounded transition-colors flex items-center justify-center gap-2" id="submitBtn" type="submit">
        <span id="btnText">Sign In</span>
      </button>
    </form>

    <div class="mt-8 pt-4 border-t border-[#e6e2da] text-center text-[11px] text-[#78716c]">
      Prof. of Practice Engr. Krishnavel · Academic Year 2024–25
    </div>
  </main>

  <script>
    function toggleSecretVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        pwd.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function simulateAuth() {
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      btnText.textContent = 'Authenticating...';
      btn.disabled = true;

      setTimeout(() => {
        localStorage.setItem('academic_portal_authenticated', 'true');
        window.location.href = '/dashboard';
      }, 400);
    }
  </script>
  <script src="/shared-portal.js"></script>
</body>
</html>
